services:
  - type: worker
    name: goodytreatbot-worker
    runtime: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: REMOVEBG_API_KEY
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: "20"
